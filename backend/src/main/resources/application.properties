# DEVELOPMENT CONFIGURATION - Environment Variables Only
# Server Configuration
spring.application.name=portfolio
server.port=${SERVER_PORT:8083}

# Database Configuration - NO HARDCODED PASSWORDS
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:portfolio_db}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Priyabele1!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Health check endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Security: ALL CREDENTIALS MUST BE PROVIDED VIA ENVIRONMENT VARIABLES
# Required environment variables:
# - DB_HOST: Database host
# - DB_USERNAME: Database username  
# - DB_PASSWORD: Database password
# - DB_NAME: Database name
# - CORS_ORIGINS: Allowed CORS origins
