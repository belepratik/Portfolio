# PRODUCTION CONFIGURATION FOR AWS
# This profile is for production deployment
# Use: java -jar app.jar --spring.profiles.active=prod

# Production settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.com.portfolio=INFO

# AWS Health checks
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# All credentials MUST be provided via environment variables:
# DB_HOST - RDS endpoint
# DB_USERNAME - RDS username
# DB_PASSWORD - RDS password  
# DB_NAME - Database name
# CORS_ORIGINS - S3 website URL
# SERVER_PORT - Usually 8080 for AWS